name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint · Typecheck · Build · Unit · Security · Perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Hexagonal guard (domain sin dependencias de infraestructura)
        run: |
          if rg -n "generated/prisma|infrastructure|application" src/domain --glob '*.ts'; then
            echo "::error::La capa domain no debe importar de generated/prisma, infrastructure ni application"
            exit 1
          fi
          echo "Dominio limpio de dependencias de infraestructura."

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Security scan + audit
        run: pnpm test:security

      - name: Performance gate
        run: pnpm test:perf

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Mutation tests
        run: pnpm test:mutation

  e2e:
    name: E2E (integración contra Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # DATABASE_URL apunta a la BD efímera del CI; el loader respeta
      # variables ya definidas en process.env (no las sobreescribe).
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_test
        run: pnpm exec prisma migrate deploy

      - name: E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_test
          KEYMASTER: ${{ secrets.KEYMASTER }}
        run: pnpm test:e2e
